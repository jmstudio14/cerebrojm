name: Validar vault

on:
  push:
  pull_request:

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tests de la agenda (iCal)
        run: node --test _sistema/tests/agenda.test.js
      - name: Frontmatter de los proyectos
        run: node _sistema/tests/validar-vault.mjs
