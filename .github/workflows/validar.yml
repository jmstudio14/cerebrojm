name: Validar vault

on:
  push:
  pull_request:

jobs:
  validar:
    name: ${{ matrix.os }} · Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # Node expande el patrón: un test nuevo en _sistema/tests/ entra solo, sin tocar este archivo.
      - name: Tests (agenda, escáner, escritura atómica, respaldo, estado, repos, coherencia y validador)
        run: node --test "_sistema/tests/*.test.*"
      - name: Frontmatter de las notas del repo
        run: node _sistema/tests/validar-vault.mjs
