name: Validar vault

on:
  push:
  pull_request:

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tests de la agenda (iCal)
        run: node --test _sistema/tests/agenda.test.js
      - name: Tests del escáner de proyectos
        run: node --test _sistema/tests/escanear.test.mjs
      - name: Tests de la escritura atómica
        run: node --test _sistema/tests/atomico.test.mjs
      - name: Tests de la copia de seguridad cifrada
        run: node --test _sistema/tests/respaldo.test.mjs
      - name: Tests del resumen de estado de proyectos
        run: node --test _sistema/tests/estado.test.mjs
      - name: Tests del estado de los repos
        run: node --test _sistema/tests/repos.test.mjs
      - name: Coherencia de .gitignore con la política de datos
        run: node --test _sistema/tests/coherencia.test.mjs
      - name: Tests del validador de frontmatter
        run: node --test _sistema/tests/validar-vault.test.mjs
      - name: Frontmatter de las notas del repo
        run: node _sistema/tests/validar-vault.mjs
